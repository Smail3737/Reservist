name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Check PHP
        run: php -v

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run SAST
        run: semgrep scan --config auto .
